[package]
name = "native-media"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "async", "error_anyhow"] }
napi-derive = "2"
tokio = { version = "1", features = ["fs", "process", "rt", "macros"] }

[build-dependencies]
napi-build = "2"
